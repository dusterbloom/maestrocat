# config/maestrocat.yaml
# MaestroCat Configuration
vad:
  energy_threshold: 0.5
  min_speech_ms: 250
  pause_ms: 800

stt:
  host: "localhost"
  port: 9090
  language: "en"
  translate: false
  model: "small"
  use_vad: true

llm:
  base_url: "http://localhost:11434"
  model: "gemma3:4b"
  temperature: 0.5
  max_tokens: 150
  repetition_penalty: 1.3  # Discourage the model from repeating itself
  top_p: 0.9
  top_k: 40
  system_prompt: "You are MaestroCat, a helpful AI voice assistant. Keep responses very brief and conversational. Never use emojis, emoticons, or special symbols in your responses - only plain text."

tts:
  base_url: "http://localhost:5000"
  voice: "af_bella"
  speed: 1.0
  sample_rate: 24000  # Kokoro typically uses 24kHz for better quality

interruption:
  threshold: 0.2
  ack_delay: 0.05

modules:
  voice_recognition:
    enabled: false
    model: "speechbrain"  # Options: "speechbrain", "pyannote", "mock"
    sample_rate: 16000
    window_size: 3.0  # seconds of audio for analysis
    confidence_threshold: 0.85  # Minimum confidence for speaker identification
    min_speech_duration: 1.0  # Minimum speech before attempting identification
    profile_dir: "data/speaker_profiles"  # Directory for speaker profiles
    # Speaker enrollment settings
    enrollment:
      min_samples: 3  # Minimum audio samples for enrollment
      sample_duration: 3.0  # Duration of each enrollment sample
    # Performance settings
    performance:
      queue_size: 100  # Max audio chunks in processing queue
      use_gpu: true  # Use GPU acceleration if available
  memory:
    enabled: false
    max_history: 100