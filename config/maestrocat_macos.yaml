# config/maestrocat_macos.yaml
# MaestroCat Configuration for macOS (Apple Silicon)
# Uses native macOS services instead of Docker containers

vad:
  energy_threshold: 0.5
  min_speech_ms: 150     # Faster speech detection
  pause_ms: 500          # Shorter pause for faster response

# STT Configuration
stt:
  service: "whispercpp_streaming"   # Options: "whispercpp", "whispercpp_streaming", "mlx_whisper"
  model_size: "base"      # Optimized for thermal performance on MacBook
  language: "it"          # Language code or "auto" for detection
  translate: false
  sample_rate: 16000
  use_vad: true           # Voice Activity Detection
  vad_threshold: 0.5      # VAD sensitivity
  
  # Streaming STT specific settings (optimized for thermal management)
  model_path: "./mlx_models/ggml-base-q5_1.bin"  # Smaller model to prevent overheating
  block_size: 512        # Audio block size for streaming
  threads: 3             # Reduced thread count for better thermal management
  step_ms: 2500          # Process less frequently to reduce CPU load
  length_ms: 3000        # Smaller context window to reduce memory usage
  keep_ms: 100           # Minimal context retention to prevent memory buildup
  voice_threshold: 0.8   # Voice activity detection threshold (0.0-1.0)
  preload_model: true    # Pre-load model during startup for instant transcription

# Native Ollama LLM
llm:
  base_url: "http://localhost:11434"  # Local Ollama service (install with 'brew install ollama')
  model: "llama3.2:3b"               # Fastest model for sub-second response
  temperature: 0.3
  repetition_penalty: 1.1  # Discourage the model from repeating itself
  max_tokens: 100                     # Very short responses only
  top_p: 0.9
  top_k: 40
  system_prompt: "You are MaestroCat. Be extremely concise - respond in 1-2 short sentences max. Never explain context or say 'based on our previous conversations'. Just answer directly. If asked about something you know from context, state it as fact without explanation."

# Native Kokoro ONNX TTS - preferred for streaming with Apple Silicon acceleration
tts:
  service: "native_kokoro"    # Options: "macos", "pyttsx3", "kokoro", "native_kokoro"  
  # Native Kokoro settings (Apple Silicon optimized)
  voice: "af_bella"           # Available voices: af, af_bella, af_nicole, af_sarah, af_sky, am_adam, am_michael, bf_emma, bf_isabella, bm_george, bm_lewis
  speed: 1.0
  sample_rate: 24000     # Kokoro's native sample rate

# Alternative TTS configurations
tts_alternatives:
  # macOS System TTS with different voice
  alex:
    service: "macos"
    voice: "Alex"
    rate: 180
    volume: 0.9
    sample_rate: 22050
    
  # PyTTSx3 TTS (requires: pip install pyttsx3 pyobjc)
  pyttsx3:
    service: "pyttsx3"
    voice_id: null         # Use default voice
    rate: 200
    volume: 0.8
    sample_rate: 22050
    
  # Kokoro TTS (if Docker is available)
  kokoro:
    service: "kokoro"
    base_url: "http://localhost:5001"
    voice: "af_bella"
    speed: 1.0
    sample_rate: 24000

interruption:
  threshold: 0.2
  ack_delay: 0.05

modules:
  voice_recognition:
    enabled: true
    model: "speechbrain"  # Options: "speechbrain", "pyannote", "mock"
    sample_rate: 16000
    window_size: 3.0  # seconds of audio for analysis
    confidence_threshold: 0.85  # Minimum confidence for speaker identification
    min_speech_duration: 1.0  # Minimum speech before attempting identification
    profile_dir: "data/speaker_profiles"  # Directory for speaker profiles
    # Speaker enrollment settings
    enrollment:
      min_samples: 3  # Minimum audio samples for enrollment
      sample_duration: 3.0  # Duration of each enrollment sample
    # Performance settings
    performance:
      queue_size: 100  # Max audio chunks in processing queue
      use_gpu: false  # Use Metal acceleration on macOS instead
  memory:
    enabled: true
    type: amem  # Use Agentic Memory
    max_history: 100
  amem:
    enabled: true
    chroma_path: "data/memory/amem_db"
    collection_name: "a-mem-collection"
    sqlite_path: "data/memory/amem_conversations.db"
    amem_llm:
      model: "gemma3:1b"  # Better at structured outputs than tinyllama
      base_url: "http://localhost:11434"
      temperature: 0.0
    tier1_enabled: true  # SQLite for fast keyword search
    tier2_enabled: true  # ChromaDB for semantic search
    tier3_enabled: true  # Memory cache
    cache_size: 100

# macOS-specific settings
macos:
  # Audio settings
  audio:
    input_device: null     # null = use default microphone
    output_device: null    # null = use default speakers
    buffer_size: 512       # Smaller buffer for lower latency
    
  # Performance settings for Apple Silicon
  performance:
    whispercpp_native: true   # Use native Whisper.cpp (fastest)
    ollama_threads: 0         # 0 = auto-detect cores
    metal_acceleration: true  # Use Metal GPU acceleration where available
    
  # Service installation hints
  dependencies:
    whispercpp: "brew install whisper-cpp"  # Fastest STT for macOS
    ollama: "brew install ollama"
    ffmpeg: "brew install ffmpeg"  # Optional for audio processing
    
# Development settings
development:
  log_level: "INFO"
  debug_ui: true
  debug_port: 8080
  websocket_port: 8765
  
# Production optimizations for Apple Silicon
production:
  # Smaller models for better performance
  stt:
    model_size: "base"     # Good balance of accuracy and thermal performance
    threads: 3             # Optimized thread count
    step_ms: 2500          # Conservative processing frequency
    
  llm:
    model: "llama3.2:1b"   # Smaller, faster model
    
  # Optimized for real-time performance
  audio:
    buffer_size: 512       # Smaller buffer for lower latency
    
  performance:
    whispercpp_optimization: true  # Enable native Whisper.cpp optimizations