# config/maestrocat_macos.yaml
# MaestroCat Configuration for macOS (Apple Silicon)
# Uses native macOS services instead of Docker containers

vad:
  energy_threshold: 0.5
  min_speech_ms: 150     # Faster speech detection
  pause_ms: 500          # Shorter pause for faster response

# STT Configuration
stt:
  service: "mlx_whisper"   # Options: "whispercpp", "whispercpp_streaming", "mlx_whisper"
  model_size: "medium"  # Using medium for faster STT processing (testing turn metrics)
  language: "it"          # Language code or "auto" for detection
  translate: false
  sample_rate: 16000
  use_vad: true           # Voice Activity Detection
  vad_threshold: 0.5      # VAD sensitivity
  
  # Streaming STT specific settings
  model_path: "models/ggml-medium.bin"  # Path to whisper.cpp model
  block_size: 512        # Audio block size for streaming
  threads: 6             # Number of threads for whisper.cpp
  step_ms: 1000          # Fixed time steps in ms (1000 = 1 second, prevents overlap)
  length_ms: 5000        # Context window length in ms (5000 = 5 seconds)
  keep_ms: 500           # Context retention between chunks in ms
  voice_threshold: 0.8   # Voice activity detection threshold (0.0-1.0)
  preload_model: true    # Pre-load model during startup for instant transcription

# Native Ollama LLM
llm:
  base_url: "http://localhost:11434"  # Local Ollama service (install with 'brew install ollama')
  model: "llama3.2:3b"               # Fastest model for sub-second response
  temperature: 0.7
  max_tokens: 150                    # Reduced for faster generation
  top_p: 0.9
  top_k: 40
  system_prompt: "You are MaestroCat, a helpful AI voice assistant. Keep responses very brief and conversational. If interrupted, acknowledge it naturally."

# Native Kokoro ONNX TTS - preferred for streaming with Apple Silicon acceleration
tts:
  service: "native_kokoro"    # Options: "macos", "pyttsx3", "kokoro", "native_kokoro"  
  # Native Kokoro settings (Apple Silicon optimized)
  voice: "af_bella"           # Available voices: af, af_bella, af_nicole, af_sarah, af_sky, am_adam, am_michael, bf_emma, bf_isabella, bm_george, bm_lewis
  speed: 1.0
  sample_rate: 24000     # Kokoro's native sample rate

# Alternative TTS configurations
tts_alternatives:
  # macOS System TTS with different voice
  alex:
    service: "macos"
    voice: "Alex"
    rate: 180
    volume: 0.9
    sample_rate: 22050
    
  # PyTTSx3 TTS (requires: pip install pyttsx3 pyobjc)
  pyttsx3:
    service: "pyttsx3"
    voice_id: null         # Use default voice
    rate: 200
    volume: 0.8
    sample_rate: 22050
    
  # Kokoro TTS (if Docker is available)
  kokoro:
    service: "kokoro"
    base_url: "http://localhost:5001"
    voice: "af_bella"
    speed: 1.0
    sample_rate: 24000

interruption:
  threshold: 0.2
  ack_delay: 0.05

modules:
  voice_recognition:
    enabled: false
    model: "speechbrain/spkrec-ecapa-voxceleb"
  memory:
    enabled: false
    max_history: 100

# macOS-specific settings
macos:
  # Audio settings
  audio:
    input_device: null     # null = use default microphone
    output_device: null    # null = use default speakers
    buffer_size: 512       # Smaller buffer for lower latency
    
  # Performance settings for Apple Silicon
  performance:
    whispercpp_native: true   # Use native Whisper.cpp (fastest)
    ollama_threads: 0         # 0 = auto-detect cores
    metal_acceleration: true  # Use Metal GPU acceleration where available
    
  # Service installation hints
  dependencies:
    whispercpp: "brew install whisper-cpp"  # Fastest STT for macOS
    ollama: "brew install ollama"
    ffmpeg: "brew install ffmpeg"  # Optional for audio processing
    
# Development settings
development:
  log_level: "INFO"
  debug_ui: true
  debug_port: 8080
  websocket_port: 8765
  
# Production optimizations for Apple Silicon
production:
  # Smaller models for better performance
  stt:
    model_size: "medium"     # Using medium for faster STT processing
    
  llm:
    model: "llama3.2:1b"   # Smaller, faster model
    
  # Optimized for real-time performance
  audio:
    buffer_size: 512       # Smaller buffer for lower latency
    
  performance:
    whispercpp_optimization: true  # Enable native Whisper.cpp optimizations