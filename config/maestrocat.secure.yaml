# config/maestrocat.secure.yaml
# Security-hardened configuration for MaestroCat production deployment

# Security Configuration
security:
  # Authentication settings
  authentication:
    jwt_secret: "${SECRET:JWT_SECRET}"
    jwt_algorithm: "HS256"
    jwt_expiry_hours: 8  # Shorter expiry for security
    api_key_length: 32
    require_https: true
    secure_cookies: true
    session_timeout_hours: 2
    
    # Default users with secure defaults
    default_users:
      - id: "admin"
        username: "admin"
        roles: ["admin"]
        enabled: true
        generate_api_key: true
      - id: "operator"
        username: "operator" 
        roles: ["operator"]
        enabled: true
        generate_api_key: true
  
  # Authorization settings
  authorization:
    enabled: true
    strict_mode: true
    
  # Rate limiting configuration
  rate_limiting:
    enabled: true
    limits:
      - type: "requests_per_minute"
        max_requests: 30  # Conservative limit
        window_seconds: 60
        action: "throttle"
        whitelist: ["127.0.0.1", "::1"]
      - type: "requests_per_hour"
        max_requests: 500
        window_seconds: 3600
        action: "temporary_ban"
        ban_duration_seconds: 300
      - type: "connections_per_minute"
        max_requests: 10
        window_seconds: 60
        action: "reject"
    
    # DDoS protection
    ddos_config:
      requests_per_second_threshold: 50
      connections_per_minute_threshold: 30
      unique_ips_threshold: 500
      detection_window_seconds: 300
  
  # Input validation
  input_validation:
    enabled: true
    strict_mode: true
    max_string_length: 8192  # Reduced from default
    max_array_length: 500
    max_object_depth: 8
    allow_html: false
  
  # Security middleware
  middleware:
    authentication_enabled: true
    authorization_enabled: true
    rate_limiting_enabled: true
    input_validation_enabled: true
    audit_logging_enabled: true
    security_headers_enabled: true
    
    # CORS settings (restrictive)
    cors_enabled: true
    allowed_origins: ["https://localhost:8080"]
    allowed_methods: ["GET", "POST", "PUT", "DELETE"]
    allowed_headers: ["Content-Type", "Authorization", "X-API-Key"]
    
    # Security headers
    security_headers:
      X-Content-Type-Options: "nosniff"
      X-Frame-Options: "DENY"
      X-XSS-Protection: "1; mode=block"
      Strict-Transport-Security: "max-age=31536000; includeSubDomains; preload"
      Content-Security-Policy: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; media-src 'self'; frame-src 'none';"
      Referrer-Policy: "strict-origin-when-cross-origin"
      Permissions-Policy: "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), accelerometer=(), gyroscope=()"
  
  # Audit logging
  audit_logging:
    enabled: true
    log_directory: "/app/logs/security"
    log_level: "info"
    max_log_size_mb: 50
    log_retention_days: 30  # Shorter retention for disk space
    compression_enabled: true
    
    # Real-time monitoring
    monitoring_enabled: true
    event_buffer_size: 500
    
    # Alert thresholds
    alert_thresholds:
      authentication_failures: 5
      authorization_failures: 3
      rate_limit_violations: 10
      validation_failures: 20

# Voice Activity Detection
vad:
  energy_threshold: 0.6  # Slightly higher for better noise rejection
  min_speech_ms: 300
  pause_ms: 700

# Speech-to-Text Configuration
stt:
  host: "127.0.0.1"  # Localhost only
  port: 9090
  language: "en"
  translate: false
  model: "small"  # Smaller model for faster processing
  use_vad: true
  vad_threshold: 0.4

# Large Language Model Configuration  
llm:
  base_url: "http://127.0.0.1:11434"  # Localhost only
  model: "llama3.2:3b"  # Smaller model for production
  temperature: 0.5  # Lower temperature for more consistent responses
  max_tokens: 500  # Reduced for security and performance
  top_p: 0.9
  top_k: 40
  system_prompt: |
    You are a helpful AI assistant. Keep responses concise and appropriate.
    Do not generate harmful, illegal, or inappropriate content.
    If asked to do something you cannot do, politely decline.

# Text-to-Speech Configuration
tts:
  base_url: "http://127.0.0.1:5000"  # Localhost only
  voice: "af_bella"
  speed: 1.0
  sample_rate: 24000

# Interruption Handling
interruption:
  threshold: 0.15  # Lower threshold for more responsive interruption
  ack_delay: 0.03

# Module Configuration (all disabled by default for security)
modules:
  voice_recognition:
    enabled: false  # Disabled for privacy
  memory:
    enabled: false  # Disabled to prevent data persistence

# Service Configuration
services:
  debug_ui:
    enabled: true
    host: "127.0.0.1"  # Localhost only
    port: 8080
    require_auth: true
    
  # Redis configuration
  redis:
    host: "127.0.0.1"  # Localhost only
    port: 6379
    password: "${SECRET:REDIS_PASSWORD}"
    ssl: false  # Enable if TLS certificates are configured
    ssl_cert_reqs: "required"
    max_connections: 20
    
# Logging Configuration
logging:
  level: "INFO"
  format: "json"  # Structured logging
  handlers:
    - type: "file"
      filename: "/app/logs/maestrocat.log"
      max_size: "50MB"
      backup_count: 5
      format: "json"
    - type: "console"
      format: "human"
      level: "WARNING"  # Only warnings and errors to console
  
  # Security-specific logging
  security_logging:
    enabled: true
    log_file: "/app/logs/security.log"
    log_level: "INFO"
    include_request_body: false  # Privacy protection
    include_response_body: false  # Privacy protection

# Performance and Resource Limits
performance:
  max_concurrent_requests: 10
  request_timeout_seconds: 30
  websocket_timeout_seconds: 300
  max_memory_usage_mb: 1024
  max_cpu_usage_percent: 80
  
  # Connection limits
  max_connections: 100
  max_websocket_connections: 20
  
  # Cache settings
  cache_ttl_seconds: 300  # 5 minutes
  max_cache_size_mb: 100

# Development and Debugging (disabled in production)
development:
  debug_mode: false
  hot_reload: false
  profiling_enabled: false
  
# Production-specific settings
production:
  environment: "production"
  secret_key: "${SECRET:SECRET_KEY}"
  
  # Health check settings
  health_check:
    enabled: true
    endpoint: "/health"
    detailed: false  # Don't expose detailed system info
    
  # Metrics collection (basic only)
  metrics:
    enabled: true
    endpoint: "/metrics"
    basic_metrics_only: true  # Don't expose sensitive metrics
  
  # Error handling
  error_handling:
    show_error_details: false  # Hide error details from users
    log_errors: true
    error_reporting: false  # Disable external error reporting
  
  # SSL/TLS settings (if reverse proxy doesn't handle)
  ssl:
    enabled: false  # Usually handled by reverse proxy
    cert_file: "/app/certs/server.crt"
    key_file: "/app/certs/server.key"
    
# Backup and Recovery
backup:
  enabled: false  # No sensitive data to backup by default
  location: "/app/backups"
  retention_days: 7
  
# Compliance and Privacy
compliance:
  data_retention_days: 7  # Minimal retention
  anonymize_logs: true
  gdpr_compliance: true
  log_user_data: false  # Don't log personal data