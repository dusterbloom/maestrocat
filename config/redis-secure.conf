# Redis Secure Configuration
# Security-hardened Redis configuration for MaestroCat

# Network Security
bind 127.0.0.1
port 6379
protected-mode yes
tcp-backlog 511

# Authentication
requirepass ${REDIS_PASSWORD:-maestrocat_secure_password_2024}
# rename-command FLUSHDB ""
# rename-command FLUSHALL ""
# rename-command DEBUG ""
# rename-command CONFIG "CONFIG_c3d8f1a2b5e7"
# rename-command SHUTDOWN "SHUTDOWN_a1b2c3d4e5f6"
# rename-command EVAL ""

# Access Control Lists (ACL) - Redis 6+
# user default off
# user maestrocat on >maestrocat_user_password ~* &* +@all -@dangerous

# General Settings
daemonize no
supervised no
pidfile /var/run/redis_6379.pid
loglevel notice
logfile ""
databases 16

# Security: Disable dangerous commands
rename-command FLUSHDB FLUSHDB_DISABLED
rename-command FLUSHALL FLUSHALL_DISABLED  
rename-command DEBUG DEBUG_DISABLED
rename-command EVAL EVAL_DISABLED
rename-command SCRIPT SCRIPT_DISABLED

# Memory Management
maxmemory 256mb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# Persistence - Disabled for security and performance
save ""
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# Append Only File - Enabled for durability
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
aof-use-rdb-preamble yes

# Security: Slow log for monitoring
slowlog-log-slower-than 10000
slowlog-max-len 128

# Security: Client timeout
timeout 300
tcp-keepalive 300

# Security: Disable potentially dangerous features
enable-protected-configs no
enable-debug-command no
enable-module-command no

# Performance tuning
hz 10
dynamic-hz yes
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
list-compress-depth 0
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64
hll-sparse-max-bytes 3000
stream-node-max-bytes 4096
stream-node-max-entries 100

# Security: TLS Configuration (if needed)
# tls-port 6380
# tls-cert-file /path/to/redis.crt
# tls-key-file /path/to/redis.key
# tls-ca-cert-file /path/to/ca.crt
# tls-protocols "TLSv1.2 TLSv1.3"