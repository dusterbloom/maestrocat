# MaestroCat Unified Configuration
# This configuration works across all platforms with platform-specific sections

# Universal language setting - controls entire pipeline
language: "it"  # Options: en, it, fr, es, pt, ja, zh

# Language-specific configurations
language_config:
  en:
    voice: "af_bella"
    stt_language: "en"
    system_prompt: "You are MaestroCat, a helpful AI voice assistant with a memory tool. When the user asks a question, first decide if you need to consult your memory. Your memory contains past conversations and user preferences. If you need to use your memory, formulate a search query. Otherwise, answer directly. When you see a [Recalled Memory Context] block, use that information to inform your response."
  it:
    voice: "if_sara"
    stt_language: "it"
    system_prompt: "Sei MaestroCat, un assistente vocale AI utile. Rispondi sempre in italiano. Mantieni le risposte brevi e conversazionali. Se vengo interrotto, riconoscilo naturalmente. Quando incontri qualcuno di nuovo, chiedi educatamente il suo nome per personalizzare la conversazione. Quando ricevi un messaggio [System: Recognized returning user - NOME is back], salutalo calorosamente per nome."
  fr:
    voice: "ff_siwis"
    stt_language: "fr"
    system_prompt: "Tu es MaestroCat, un assistant vocal IA utile. Réponds toujours en français. Garde tes réponses brèves et conversationnelles. Si tu es interrompu, reconnais-le naturellement. Lorsque tu rencontres quelqu'un de nouveau, demande poliment son nom pour personnaliser la conversation. Lorsque tu reçois un message [System: Recognized returning user - NOM is back], salue-le chaleureusement par son nom."
  es:
    voice: "af_bella"  # Fallback to English voice for now
    stt_language: "es"
    system_prompt: "Eres MaestroCat, un asistente de voz AI útil. Responde siempre en español. Mantén las respuestas breves y conversacionales. Si te interrumpen, reconócelo naturalmente. Cuando conozcas a alguien nuevo, pregunta educadamente su nombre para personalizar la conversación. Cuando recibas un mensaje [System: Recognized returning user - NOMBRE is back], salúdalo calurosamente por su nombre."
  pt:
    voice: "af_bella"  # Fallback to English voice for now
    stt_language: "pt"
    system_prompt: "Você é MaestroCat, um assistente de voz AI útil. Responda sempre em português. Mantenha as respostas breves e conversacionais. Se for interrompido, reconheça naturalmente. Ao conhecer alguém novo, pergunte educadamente o nome da pessoa para personalizar a conversa. Quando receber uma mensagem [System: Recognized returning user - NOME is back], cumprimente-a calorosamente pelo nome."
  ja:
    voice: "af_bella"  # Fallback to English voice for now
    stt_language: "ja"
    system_prompt: "あなたはMaestroCat、親切なAI音声アシスタントです。常に日本語で応答してください。リアルタイムの音声対話のために、応答は簡潔で会話的に保ってください。中断された場合は、自然に認識して続けてください。新しい人に会ったときは、会話をパーソナライズするために丁寧に名前を尋ねてください。[System: Recognized returning user - 名前 is back]というメッセージを受け取ったら、その人の名前で温かく挨拶してください。"
  zh:
    voice: "af_bella"  # Fallback to English voice for now
    stt_language: "zh"
    system_prompt: "你是MaestroCat，一个有用的AI语音助手。请始终用中文回复。保持回复简短和对话式，以适应实时语音交互。如果被打断，自然地承认并继续。遇到新朋友时，请礼貌地询问他们的名字以个性化对话。当你收到[System: Recognized returning user - 名字 is back]消息时，请用他们的名字热情地打招呼。"

# Core VAD settings (used by all platforms)
vad:
  energy_threshold: 0.5  # Lower threshold for better microphone detection
  min_speech_ms: 250     # Faster detection
  pause_ms: 800          # Shorter pause for more responsive interaction

# Base STT configuration
stt:
  translate: false

# Base LLM configuration  
llm:
  model: "llama3.2:3b"
  temperature: 0.7
  max_tokens: 400
  top_p: 0.9
  top_k: 40

# Base TTS configuration
tts:
  speed: 1.0

# Interruption handling (universal)
interruption:
  threshold: 0.2
  ack_delay: 0.05

# Module configuration (universal)
modules:
  voice_recognition:
    enabled: true
    model: "speechbrain"  # Options: "speechbrain", "pyannote", "mock"
    sample_rate: 16000
    window_size: 3.0  # seconds of audio for analysis
    confidence_threshold: 0.55  # Lowered for real-world conditions (was 0.99)
    min_speech_duration: 1.0  # Minimum speech before attempting identification
    profile_dir: "data/speaker_profiles"  # Directory for speaker profiles
    # Automatic enrollment - the magic happens here!
    auto_enroll:
      min_utterances: 3  # Learn a voice after 3 consistent utterances
      consistency_threshold: 0.60  # Lowered for real-world audio (was 0.95)
      min_consistency_threshold: 0.45  # Minimum threshold for collecting utterances (was 0.70)
      enrollment_window_minutes: 30  # Consider utterances within 30 minute window
      new_speaker_grace_period_seconds: 120  # Grace period after enrollment
      new_speaker_similarity_threshold: 0.50  # Lower threshold during grace period
    # Speaker enrollment settings
    enrollment:
      min_samples: 3  # Minimum audio samples for enrollment
      sample_duration: 3.0  # Duration of each enrollment sample
    # Performance settings
    performance:
      queue_size: 100  # Max audio chunks in processing queue
      use_gpu: false  # Disable GPU for CPU optimization on macOS
  memory:
    enabled: true
    type: "amem"  # Options: "sqlite", "amem"
    database_path: "data/memory/conversations.db"
    max_history: 1000
    enable_search: true
    context_window_minutes: 30
    context_injection:
      enabled: true
      max_messages: 5
      time_window_minutes: 5
    cleanup:
      enabled: true
      retention_days: 30
      cleanup_interval_hours: 24
  amem:
    enabled: true
    chroma_path: "data/memory/amem_db"
    collection_name: "a-mem-collection"
    amem_llm:
      model: "llama3.2:3b"
      base_url: "http://localhost:11434"
      temperature: 0.0

# Development settings (universal)
development:
  log_level: "INFO"
  debug_ui: true
  debug_port: 8080
  websocket_port: 8765

# Platform-specific configurations
platforms:
  # Docker platform configuration
  docker:
    stt:
      service: "whisperlive"
      host: "localhost" 
      port: 9090
      model: "small"
      sample_rate: 16000
      use_vad: false
    
    llm:
      base_url: "http://localhost:11434"
      # Override model for GPU vs CPU
      model_gpu: "llama3.2:3b"
      model_cpu: "llama3.2:1b"
    
    tts:
      service: "kokoro"
      base_url: "http://localhost:5000"
      sample_rate: 24000
    
    # Docker-specific optimizations
    docker:
      compose_files:
        gpu: ["docker-compose.yml", "docker-compose.gpu.yml"]
        cpu: ["docker-compose.yml", "docker-compose.cpu.yml"]
      service_urls:
        whisperlive: "ws://localhost:9090"
        ollama: "http://localhost:11434"
        kokoro: "http://localhost:5000"
      health_check_timeout: 60
    
    # VAD optimized for Docker services
    vad:
      min_speech_ms: 250
      pause_ms: 800

  # macOS native platform configuration  
  macos_native:
    stt:
      service: "whispercpp_streaming"    # MLX Whisper for Apple Silicon optimization
      model_size: "base"                # Small model for good accuracy
      sample_rate: 16000
      channels: 1                        # Mono audio
      block_size: 512                    # Audio chunk size (512 = responsive)
      max_latency_ms: 200               # Maximum acceptable latency
      use_vad: true                      # Enable voice activity detection
      vad_threshold: 0.8                 # VAD sensitivity
      preload_model: true                # Pre-load model during startup for instant transcription
    
    llm:
      base_url: "http://localhost:11434"
      # Recommended models for Apple Silicon
      model_m1: "llama3.2:1b"    # Conservative for M1
      model_m2: "llama3.2:3b"    # Good for M2
      model_m3: "llama3.2:7b"    # Powerful M3 can handle larger
    
    tts:
      service: "native_kokoro"  # Options: "macos", "pyttsx3", "native_kokoro"
      sample_rate: 24000
      # Fallback to macOS TTS if native_kokoro fails
      fallback:
        service: "macos"
        voice: "Samantha"
        rate: 180
        volume: 0.9
        sample_rate: 22050
    
    # Alternative TTS configurations for macOS
    tts_alternatives:
      macos_system:
        service: "macos"
        voice: "Alex"
        rate: 180
        volume: 0.9
        sample_rate: 22050
      
      pyttsx3:
        service: "pyttsx3"
        voice_id: null
        rate: 200
        volume: 0.8
        sample_rate: 22050
    
    # macOS-specific settings
    macos:
      # Audio settings
      audio:
        input_device: null     # null = use default
        output_device: null    # null = use default  
        buffer_size: 512       # Smaller for lower latency
      
      # Performance settings for Apple Silicon
      performance:
        mlx_whisper: true      # Use MLX acceleration
        ollama_threads: 0      # 0 = auto-detect cores
        metal_acceleration: true
        mlx_optimization: true
      
      # Service dependencies
      dependencies:
        ollama: "brew install ollama"
        ffmpeg: "brew install ffmpeg"
        mlx_whisper: "pip install 'pipecat-ai[mlx-whisper]'"
    
    # VAD optimized for native performance
    vad:
      min_speech_ms: 250     # Faster detection (reduced from 250)
      pause_ms: 1500          # Balanced pause detection (reduced from 1000)

  # WSL platform configuration (extends Docker)
  wsl:
    extends: "docker"  # Inherit Docker configuration
    
    # WSL-specific overrides
    audio:
      transport: "wsl_audio_transport"
      buffer_size: 1024  # Larger buffer for WSL audio issues
    
    # Conservative settings for WSL
    llm:
      model: "llama3.2:1b"  # Smaller model for WSL performance
    
    stt:
      model: "medium"  # Fastest model for WSL

  # Windows platform configuration (extends Docker)
  windows:
    extends: "docker"  # Inherit Docker configuration
    
    # Windows-specific overrides
    audio:
      transport: "windows_audio_transport"
    
    # Conservative settings
    llm:
      model: "llama3.2:1b"

# Platform selection hints
platform:
  # Auto-detection behavior
  auto_detect: true
  
  # Preferred platform (overrides auto-detection)
  # Options: "docker", "macos_native", "wsl", "windows"
  preferred: null
  
  # Fallback hierarchy
  fallbacks:
    macos_native: ["docker"]
    docker: ["macos_native"]  # If on macOS
    wsl: ["docker"]
    windows: ["docker"]

# Production optimizations by platform
production:
  # Docker production settings
  docker:
    stt:
      model: "medium"  # Using medium for faster STT processing
    llm:
      model: "llama3.2:1b"
      max_tokens: 100
    audio:
      buffer_size: 512
  
  # macOS production settings
  macos_native:
    stt:
      service: "lightning_whisper_mlx"
      model_size: "medium"
      compute_type: "int8"  # Quantized for max speed
      beam_size: 1         # Greedy search for speed
    llm:
      model: "llama3.2:1b" 
      max_tokens: 100
    macos:
      performance:
        mlx_optimization: true
        lightning_mlx: true  # Enable Lightning MLX optimizations

# Advanced configuration
advanced:
  # Enable platform capability detection
  detect_capabilities: true
  
  # Enable performance profiling
  enable_profiling: false
  
  # Enable service health monitoring
  health_monitoring:
    enabled: true
    interval: 30  # seconds
  
  # Enable automatic service recovery
  auto_recovery:
    enabled: true
    max_retries: 3
    backoff_factor: 2.0