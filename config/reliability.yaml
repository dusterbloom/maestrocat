# MaestroCat Reliability Configuration
# Comprehensive error recovery and reliability settings

# Global event system settings
event_buffer_size: 1000
event_emit_as_frames: true

# Service registry settings
registry_enabled: true
registry_default_strategy: "priority_first"  # priority_first, round_robin, weighted_random, etc.
registry_service_timeout: 30.0

# System monitoring settings
system_monitoring_enabled: true
system_memory_threshold_mb: 1024
system_cpu_threshold_percent: 80.0

# Logging settings
reliability_log_level: "INFO"
enable_performance_logging: true
enable_error_aggregation: true

# Default service configuration (applies to all services unless overridden)
default_service:
  # Circuit breaker settings
  circuit_breaker_enabled: true
  circuit_breaker_failure_threshold: 5      # Failures before opening circuit
  circuit_breaker_success_threshold: 3      # Successes needed to close circuit
  circuit_breaker_timeout: 60.0             # Seconds to wait before half-open
  circuit_breaker_request_timeout: 30.0     # Individual request timeout
  circuit_breaker_health_check_interval: 30.0

  # Exponential backoff settings
  backoff_enabled: true
  backoff_initial_delay: 1.0                # Initial delay in seconds
  backoff_max_delay: 60.0                   # Maximum delay in seconds
  backoff_multiplier: 2.0                   # Backoff multiplier
  backoff_jitter: true                      # Add randomness to prevent thundering herd
  backoff_max_retries: 3                    # Maximum retry attempts
  backoff_strategy: "exponential"           # exponential, linear, fixed, fibonacci

  # Error handling settings
  error_handler_enabled: true
  error_rate_window: 300.0                  # Error rate calculation window (seconds)
  circuit_break_threshold: 10               # Errors per window to trigger circuit break

  # Memory guard settings
  memory_guard_enabled: true
  memory_medium_threshold_mb: 512           # Start monitoring closely
  memory_high_threshold_mb: 1024            # Take corrective action
  memory_critical_threshold_mb: 2048        # Emergency cleanup
  memory_check_interval: 30.0               # Memory check frequency

  # Health monitoring settings
  health_monitoring_enabled: true
  health_check_interval: 30.0               # Health check frequency
  health_check_timeout: 10.0                # Health check timeout
  consecutive_failures_threshold: 3         # Failures before marking unhealthy

# Service-specific configuration overrides
services:
  # WhisperLive STT Service
  whisperlive_stt:
    # More lenient settings for WebSocket connections
    circuit_breaker_failure_threshold: 3
    circuit_breaker_timeout: 30.0
    backoff_max_retries: 5
    backoff_max_delay: 30.0
    
    # Lower memory thresholds for audio processing
    memory_medium_threshold_mb: 256
    memory_high_threshold_mb: 512
    memory_critical_threshold_mb: 1024
    
    # Faster health checks for real-time service
    health_check_interval: 15.0
    consecutive_failures_threshold: 2
    
    # WebSocket-specific settings
    service_specific:
      reconnect_on_close: true
      ping_interval: 30.0
      max_audio_buffer_size: 32768
      segment_deduplication: true

  # Kokoro TTS Service  
  kokoro_tts:
    # HTTP service settings
    circuit_breaker_failure_threshold: 3
    circuit_breaker_timeout: 60.0
    backoff_initial_delay: 0.5
    backoff_max_delay: 10.0
    backoff_multiplier: 1.5
    
    # Higher memory thresholds for audio generation
    memory_medium_threshold_mb: 512
    memory_high_threshold_mb: 1024
    memory_critical_threshold_mb: 2048
    
    # HTTP-specific settings
    service_specific:
      connection_timeout: 5.0
      request_timeout: 30.0
      max_connections: 20
      keepalive_connections: 10
      streaming_buffer_size: 1024

  # Ollama LLM Service
  ollama_llm:
    # LLM generation can take longer
    circuit_breaker_request_timeout: 60.0
    circuit_breaker_timeout: 120.0
    backoff_max_delay: 120.0
    
    # Moderate memory settings
    memory_medium_threshold_mb: 1024
    memory_high_threshold_mb: 2048
    memory_critical_threshold_mb: 4096
    
    # Less frequent health checks for LLM
    health_check_interval: 60.0
    
    # LLM-specific settings
    service_specific:
      model_warmup: true
      context_size_limit: 4096
      generation_timeout: 120.0

  # Native macOS services
  whispercpp_stt:
    # Process-based service, different reliability patterns
    circuit_breaker_enabled: false          # Process restarts handle failures
    backoff_max_retries: 2
    memory_guard_enabled: false             # Native memory management
    
    service_specific:
      model_path: "/opt/homebrew/share/whisper-cpp/models"
      threads: -1                           # Use all CPU cores
      use_gpu: true

  macos_tts:
    # System TTS is very reliable
    circuit_breaker_failure_threshold: 10
    circuit_breaker_timeout: 30.0
    backoff_max_retries: 1
    memory_guard_enabled: false
    
    service_specific:
      voice: "Alex"
      rate: 200
      volume: 0.8

# Environment-specific overrides
environments:
  development:
    reliability_log_level: "DEBUG"
    
    # More lenient settings for development
    default_service:
      circuit_breaker_failure_threshold: 10
      backoff_max_retries: 2
      memory_critical_threshold_mb: 4096
      health_check_interval: 60.0
      
  production:
    reliability_log_level: "WARNING"
    enable_performance_logging: false
    
    # Stricter settings for production
    default_service:
      circuit_breaker_failure_threshold: 3
      backoff_max_retries: 5
      memory_medium_threshold_mb: 256
      memory_high_threshold_mb: 512
      memory_critical_threshold_mb: 1024
      health_check_interval: 15.0
      
  high_availability:
    reliability_log_level: "ERROR"
    
    # Maximum reliability settings
    default_service:
      circuit_breaker_failure_threshold: 2
      circuit_breaker_timeout: 30.0
      circuit_breaker_health_check_interval: 10.0
      backoff_max_retries: 8
      memory_medium_threshold_mb: 128
      memory_high_threshold_mb: 256
      memory_critical_threshold_mb: 512
      health_check_interval: 10.0
      consecutive_failures_threshold: 1

# Fallback chains - define service fallback sequences
fallback_chains:
  stt:
    - "whisperlive_stt_primary"
    - "whisperlive_stt_backup" 
    - "whispercpp_stt_fallback"
    - "silence_fallback"
    
  tts:
    - "kokoro_tts_primary"
    - "macos_tts_fallback"
    - "pyttsx3_fallback"
    
  llm:
    - "ollama_llm_primary"
    - "ollama_llm_backup"

# Service discovery and load balancing
service_discovery:
  # STT Services
  stt_services:
    - id: "whisperlive_stt_primary"
      type: "stt"
      name: "WhisperLive Primary"
      priority: 100
      weight: 80
      endpoints:
        - protocol: "ws"
          host: "localhost"
          port: 9090
      capabilities:
        languages: ["en", "es", "fr", "de"]
        models: ["tiny", "small", "base", "large"]
        real_time: true
        
    - id: "whispercpp_stt_fallback"
      type: "stt" 
      name: "Whisper.cpp Fallback"
      priority: 50
      weight: 60
      endpoints:
        - protocol: "process"
          host: "localhost"
          path: "/opt/homebrew/bin/whisper-cpp"
      capabilities:
        languages: ["en"]
        models: ["base", "small"]
        real_time: false

  # TTS Services  
  tts_services:
    - id: "kokoro_tts_primary"
      type: "tts"
      name: "Kokoro TTS Primary"
      priority: 100
      weight: 90
      endpoints:
        - protocol: "http"
          host: "localhost"
          port: 5000
          path: "/v1/audio/speech"
      capabilities:
        voices: ["af_bella", "af_sarah", "am_adam"]
        formats: ["wav", "mp3"]
        streaming: true
        
    - id: "macos_tts_fallback"
      type: "tts"
      name: "macOS System TTS"
      priority: 50
      weight: 70
      endpoints:
        - protocol: "system"
          host: "localhost"
      capabilities:
        voices: ["Alex", "Samantha", "Victoria"]
        formats: ["wav"]
        streaming: false

  # LLM Services
  llm_services:
    - id: "ollama_llm_primary"
      type: "llm"
      name: "Ollama Primary"
      priority: 100
      weight: 100
      endpoints:
        - protocol: "http"
          host: "localhost"
          port: 11434
          path: "/api/chat"
      capabilities:
        models: ["llama3.2:3b", "llama3.2:1b"]
        streaming: true
        context_size: 4096