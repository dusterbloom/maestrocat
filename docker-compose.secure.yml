# docker-compose.secure.yml
# Hardened Docker Compose configuration with security best practices

services:
  # WhisperLive STT Server - Hardened
  whisperlive:
    image: ${WHISPERLIVE_IMAGE:-ghcr.io/collabora/whisperlive-cpu:latest}
    container_name: whisperlive-secure
    
    # Security: Run as non-root user
    user: "1001:1001"
    
    # Security: Bind to localhost only - no external exposure
    ports:
      - "127.0.0.1:9090:9090"
    
    volumes:
      - whisper_models:/app/models:ro  # Read-only mount
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 100m
          mode: 0755
    
    environment:
      - OMP_NUM_THREADS=${WHISPER_OMP_THREADS:-4}
      - WHISPER_DEVICE=${WHISPER_DEVICE:-cpu}
      # Security: Disable core dumps
      - CORE_DUMP_DISABLED=1
    
    # Security: Resource limits
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    
    # Security: Read-only root filesystem
    read_only: true
    tmpfs:
      - /tmp:size=100m,mode=0755
      - /var/tmp:size=50m,mode=0755
    
    # Security: Capability restrictions
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    
    # Security: No new privileges
    security_opt:
      - no-new-privileges:true
      - seccomp:unconfined  # May need adjustment based on whisper requirements
    
    networks:
      - maestrocat-secure-network
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    restart: unless-stopped
    
    # Security: Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Kokoro TTS Server - Hardened
  kokoro:
    image: ${KOKORO_IMAGE:-ghcr.io/remsky/kokoro-fastapi-cpu:latest}
    container_name: kokoro-secure
    
    # Security: Run as non-root user
    user: "1002:1002"
    
    # Security: Bind to localhost only
    ports:
      - "127.0.0.1:5000:8880"
    
    volumes:
      - kokoro_models:/models:ro  # Read-only mount
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 200m
          mode: 0755
    
    environment:
      - MODEL_PATH=/models
      - DEFAULT_VOICE=af_bella
      - DEVICE=${KOKORO_DEVICE:-cpu}
      - CORE_DUMP_DISABLED=1
      # Security: Restrict Python path
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    
    # Security: Resource limits
    deploy:
      resources:
        limits:
          cpus: '3.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 1G
    
    # Security: Read-only root filesystem
    read_only: true
    tmpfs:
      - /tmp:size=200m,mode=0755
      - /var/tmp:size=100m,mode=0755
      - /app/cache:size=500m,mode=0755
    
    # Security: Capability restrictions
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    
    # Security: No new privileges
    security_opt:
      - no-new-privileges:true
      - seccomp:unconfined
    
    networks:
      - maestrocat-secure-network
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8880/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    restart: unless-stopped
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Ollama LLM Server - Hardened
  ollama:
    image: ollama/ollama
    container_name: ollama-secure
    
    # Security: Run as non-root user
    user: "1003:1003"
    
    # Security: Bind to localhost only
    ports:
      - "127.0.0.1:11434:11434"
    
    volumes:
      - ollama_data:/root/.ollama:rw
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 1G
          mode: 0755
    
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - CORE_DUMP_DISABLED=1
      - OLLAMA_MAX_LOADED_MODELS=2
    
    # Security: Resource limits
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '2.0'
          memory: 2G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    
    # Security: Capability restrictions
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    
    # Security: No new privileges
    security_opt:
      - no-new-privileges:true
    
    networks:
      - maestrocat-secure-network
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/version"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 120s
    
    restart: unless-stopped
    
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # Redis for event bus - Hardened
  redis:
    image: redis:7-alpine
    container_name: maestrocat-redis-secure
    
    # Security: Run as non-root user
    user: "999:999"
    
    # Security: Bind to localhost only
    ports:
      - "127.0.0.1:6379:6379"
    
    volumes:
      - redis_data:/data:rw
      - ./config/redis-secure.conf:/usr/local/etc/redis/redis.conf:ro
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 50m
          mode: 0755
    
    # Security: Resource limits
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.2'
          memory: 256M
    
    # Security: Read-only root filesystem
    read_only: true
    tmpfs:
      - /tmp:size=50m,mode=0755
    
    # Security: Capability restrictions
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    
    # Security: No new privileges
    security_opt:
      - no-new-privileges:true
    
    # Use secure configuration
    command: redis-server /usr/local/etc/redis/redis.conf
    
    networks:
      - maestrocat-secure-network
    
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    
    restart: unless-stopped
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # MaestroCat Application - Hardened
  maestrocat:
    build:
      context: .
      dockerfile: docker/maestrocat/Dockerfile.secure
    container_name: maestrocat-app-secure
    
    # Security: Run as non-root user
    user: "1004:1004"
    
    # Security: Bind to localhost only
    ports:
      - "127.0.0.1:8080:8080"
    
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs:rw
      - maestrocat_cache:/app/cache:rw
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 100m
          mode: 0755
    
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - CORE_DUMP_DISABLED=1
      - MAESTROCAT_ENV=production
      - MAESTROCAT_CONFIG_FILE=/app/config/maestrocat.secure.yaml
    
    # Security: Resource limits
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    
    # Security: Read-only root filesystem
    read_only: true
    tmpfs:
      - /tmp:size=100m,mode=0755
      - /app/cache:size=200m,mode=0755
    
    # Security: Capability restrictions
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    
    # Security: No new privileges
    security_opt:
      - no-new-privileges:true
      - apparmor:docker-default
    
    networks:
      - maestrocat-secure-network
    
    depends_on:
      whisperlive:
        condition: service_healthy
      kokoro:
        condition: service_healthy
      ollama:
        condition: service_healthy
      redis:
        condition: service_healthy
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    restart: unless-stopped
    
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # Security monitoring and log aggregation
  security-monitor:
    image: alpine:latest
    container_name: maestrocat-security-monitor
    
    user: "1005:1005"
    
    volumes:
      - ./logs:/logs:ro
      - ./scripts/security-monitor.sh:/monitor.sh:ro
    
    command: /monitor.sh
    
    # Security: Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    
    # Security: Read-only root filesystem
    read_only: true
    tmpfs:
      - /tmp:size=50m,mode=0755
    
    # Security: Capability restrictions
    cap_drop:
      - ALL
    
    # Security: No new privileges
    security_opt:
      - no-new-privileges:true
    
    networks:
      - maestrocat-secure-network
    
    restart: unless-stopped
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# Secure network configuration
networks:
  maestrocat-secure-network:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_icc: "false"  # Disable inter-container communication
      com.docker.network.bridge.enable_ip_masquerade: "true"
      com.docker.network.bridge.host_binding_ipv4: "127.0.0.1"
    ipam:
      config:
        - subnet: 172.20.0.0/24
          gateway: 172.20.0.1
    labels:
      - "maestrocat.network.secure=true"

# Secure volume configuration
volumes:
  whisper_models:
    driver: local
    driver_opts:
      type: none
      o: bind,ro
      device: ./models/whisper
    labels:
      - "maestrocat.data.type=models"
      - "maestrocat.data.access=read-only"
  
  kokoro_models:
    driver: local
    driver_opts:
      type: none
      o: bind,ro
      device: ./models/kokoro
    labels:
      - "maestrocat.data.type=models"
      - "maestrocat.data.access=read-only"
  
  ollama_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/ollama
    labels:
      - "maestrocat.data.type=models"
      - "maestrocat.data.access=read-write"
  
  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/redis
    labels:
      - "maestrocat.data.type=cache"
      - "maestrocat.data.access=read-write"
  
  maestrocat_cache:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=500m,uid=1004,gid=1004,mode=0755
    labels:
      - "maestrocat.data.type=cache"
      - "maestrocat.data.temporary=true"

# Global configuration
x-common-security: &common-security
  # Security: Disable core dumps
  ulimits:
    core: 0
    memlock: -1
    nofile: 65536
  
  # Security: Process limits
  pids_limit: 1000
  
  # Security: Memory limits
  mem_swappiness: 0
  oom_kill_disable: false